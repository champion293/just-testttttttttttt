<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shared File · Mateen Cloud</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/style.css" />
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding: 20px; }
  .share-card { background: var(--surface); border:1px solid var(--border); border-radius:18px; padding:36px; max-width:420px; width:100%; text-align:center; box-shadow:var(--shadow); }
  .share-card .brand { justify-content:center; margin-bottom: 18px;}
  .share-icon { font-size: 44px; margin-bottom: 10px; }
  .share-name { font-weight:700; font-size:17px; margin-bottom:4px; word-break:break-word; }
  .share-meta { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  .share-footer { margin-top: 22px; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="share-card" id="card">
  <div class="brand"><img src="/assets/favicon.svg" width="26" height="26" alt=""/><span class="brand-name">Mateen Cloud</span></div>
  <div id="body">Loading shared file…</div>
  <div class="share-footer">Powered by Mateen Cloud<br/>Developed by <span class="rgb-credit">ABDUL MATEEN</span></div>
</div>
<script>
(async () => {
  const token = location.pathname.split('/').pop();
  const body = document.getElementById('body');
  try {
    const res = await fetch(`/api/share/${token}`);
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    const { file, permission } = json.data;
    const icons = { image: '🖼️', document: '📄', media: '🎬', archive: '🗜️', other: '📦' };
    body.innerHTML = `
      <div class="share-icon">${icons[file.category] || '📦'}</div>
      <div class="share-name">${file.name.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>
      <div class="share-meta">${file.category.toUpperCase()} · ${(file.size/1024/1024).toFixed(2)} MB</div>
      ${permission === 'download'
        ? `<a class="btn btn-primary" style="width:100%;justify-content:center;" href="/api/share/${token}/download">Download</a>`
        : `<a class="btn" style="width:100%;justify-content:center;" href="/api/share/${token}/download">View only — downloading is disabled</a>`}
    `;
  } catch (e) {
    body.innerHTML = `<div class="share-icon">⚠️</div><div class="share-name">Link unavailable</div><div class="share-meta">${(e.message||'This link may have expired.').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>`;
  }
})();
</script>
</body>
</html>
